name: Build Archivo
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: exe
            artifact: windows-x64
          - os: macos-latest
            command: mac:arm64
            artifact: mac-arm64
          - os: macos-latest
            command: mac:x64
            artifact: mac-x64
    runs-on: ${{ matrix.os }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: Archivo-${{ matrix.artifact }}
          path: |
            dist/*/*.exe
            dist/*/*.dmg
            dist/*/*.zip
          if-no-files-found: error
